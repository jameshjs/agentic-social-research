<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Worlds mark — scale proof</title>
<style>
  :root{font-family:Arial,Helvetica,sans-serif;color:#f3f6ed;background:#07131c}
  *{box-sizing:border-box}body{margin:0;padding:6vw}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1000px}
  .sheet{min-height:250px;padding:28px;border:1px solid #a8f4d145;background:#102630}.sheet.light{background:#f3f6ed;color:#07131c}
  h1{font-size:32px;letter-spacing:-.04em}h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a8f4d1}.light h2{color:#286b58}
  .brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;letter-spacing:-.07em}.brand img{width:30px;height:30px}
  .row{display:flex;align-items:center;gap:20px;margin-top:40px}.row img{display:block}.row span{font-size:11px;opacity:.7}
  .small{width:16px;height:16px}.medium{width:24px;height:24px}.large{width:64px;height:64px}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
<h1>Two Worlds / symbol scale proof</h1>
<div class="grid">
  <section class="sheet"><h2>Primary · dark UI</h2><div class="brand"><img src="./two-world-mark.svg" alt="">Two Worlds</div><div class="row"><img class="small" src="./two-world-mark.svg" alt=""><span>16 px</span><img class="medium" src="./two-world-mark.svg" alt=""><span>24 px</span><img class="large" src="./two-world-mark.svg" alt=""><span>64 px</span></div></section>
  <section class="sheet"><h2>One ink · dark UI</h2><div class="brand"><img src="./two-world-mark-mono.svg" alt="">Two Worlds</div><div class="row"><img class="small" src="./two-world-mark-mono.svg" alt=""><span>16 px</span><img class="medium" src="./two-world-mark-mono.svg" alt=""><span>24 px</span><img class="large" src="./two-world-mark-mono.svg" alt=""><span>64 px</span></div></section>
  <section class="sheet light"><h2>Light field · ink variant</h2><div class="brand"><img src="./two-world-mark-light.svg" alt="">Two Worlds</div><div class="row"><img class="small" src="./two-world-mark-light.svg" alt=""><span>16 px</span><img class="medium" src="./two-world-mark-light.svg" alt=""><span>24 px</span><img class="large" src="./two-world-mark-light.svg" alt=""><span>64 px</span></div></section>
  <section class="sheet"><h2>Browser icon · simplified grid</h2><div class="row"><img class="small" src="./two-world-favicon.svg" alt=""><span>16 px</span><img class="medium" src="./two-world-favicon.svg" alt=""><span>24 px</span><img class="large" src="./two-world-favicon.svg" alt=""><span>64 px</span></div></section>
</div>
</html>
