name: Test and deploy to Vultr

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Offline tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Engine, world, experience, and API tests
        run: >-
          node --test
          experiment/test-world-runner.js
          experience/test-world-run-adapter.js
          experiment/test-scenario-compiler.js
          experiment/test-runner.js
          experience/test-experiment-adapter.js
          experience/test-trace-adapter.js
          world/test-sandbox.js
          experiment/test-vultr-decision.js
          api/test-server.js
      - name: Persona runtime tests
        run: npm --prefix persona-swarm/runtime test
      - name: Check deploy scripts
        run: bash -n ops/deploy.sh ops/deploy-paths.sh

  deploy:
    name: Production deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://twotwosmyworld.select/experience/
    concurrency:
      group: counterfactual-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # VULTR_DEPLOY_SSH_KEY is the dedicated GitHub deploy key in root's authorized_keys on the VM
      # (not Meet's personal key). Remove that one line on the VM to revoke it.
      - name: Load the deploy key
        id: key
        env:
          VULTR_DEPLOY_SSH_KEY: ${{ secrets.VULTR_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$VULTR_DEPLOY_SSH_KEY" ]; then
            echo '::warning title=Deploy skipped::VULTR_DEPLOY_SSH_KEY repository secret is not set. Tests passed; the VM was not changed.'
            echo '### Deploy skipped: `VULTR_DEPLOY_SSH_KEY` is not set. The VM was not changed.' >> "$GITHUB_STEP_SUMMARY"
            echo configured=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s\n' "$VULTR_DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          mkdir -p ~/.ssh && cp ops/known_hosts ~/.ssh/known_hosts
          echo configured=true >> "$GITHUB_OUTPUT"
      - name: Deploy with ops/deploy.sh (keeps the VM's inference key)
        if: steps.key.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ runner.temp }}/deploy_key
        run: bash ops/deploy.sh --skip-key
      - name: Check /api/health reports this commit
        if: steps.key.outputs.configured == 'true'
        run: |
          health="$(curl -fsS --max-time 15 https://twotwosmyworld.select/api/health)"
          echo "$health"
          [[ "$health" == *"\"git_sha\":\"$GITHUB_SHA\""* ]] || { echo "::error::/api/health does not report $GITHUB_SHA"; exit 1; }
          echo "### Deployed \`$GITHUB_SHA\` to https://twotwosmyworld.select/experience/" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key from the runner
        if: always() && steps.key.outputs.configured == 'true'
        run: rm -f "$RUNNER_TEMP/deploy_key"
