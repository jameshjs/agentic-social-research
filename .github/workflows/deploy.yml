name: Test and deploy to Vultr

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Offline tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Engine, world, experience, and API tests
        run: >-
          node --test
          experiment/test-world-runner.js
          experience/test-world-run-adapter.js
          experiment/test-scenario-compiler.js
          experiment/test-runner.js
          experience/test-experiment-adapter.js
          experience/test-trace-adapter.js
          world/test-sandbox.js
          experiment/test-vultr-decision.js
          api/test-server.js
      - name: Persona runtime tests
        run: npm --prefix persona-swarm/runtime test
      - name: Check deploy scripts
        run: >-
          bash -n ops/deploy.sh ops/deploy-ci.sh ops/deploy-paths.sh
          ops/ci-deploy/counterfactual-activate ops/ci-deploy/counterfactual-ci-receive
          ops/ci-deploy/vm-setup.sh ops/ci-deploy/install-on-vm.sh ops/ci-deploy/e2e-docker.sh
      - name: CI deploy account guards (release allowlist, forced command, sudo rule)
        run: python3 -m unittest -v ops/ci-deploy/test_release_check.py

  deploy:
    name: Production deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://twotwosmyworld.select/experience/
    concurrency:
      group: counterfactual-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      # The secret is the private half of the restricted ci-deploy key (ops/ci-deploy/README.md),
      # stored as a `production` environment secret. It is never Meet's root key.
      - name: Load the ci-deploy key
        id: key
        env:
          VULTR_CI_DEPLOY_KEY: ${{ secrets.VULTR_CI_DEPLOY_KEY }}
        run: |
          if [ -z "$VULTR_CI_DEPLOY_KEY" ]; then
            echo '::warning title=Deploy skipped::VULTR_CI_DEPLOY_KEY is not set for the production environment. Tests passed; the VM was not changed. See ops/ci-deploy/README.md.'
            echo '### Deploy skipped: `VULTR_CI_DEPLOY_KEY` is not configured. The VM was not changed.' >> "$GITHUB_STEP_SUMMARY"
            echo configured=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s\n' "$VULTR_CI_DEPLOY_KEY" > "$RUNNER_TEMP/ci_deploy_key"
          echo configured=true >> "$GITHUB_OUTPUT"
      - name: Deploy through the restricted account and smoke test both policy runs
        if: steps.key.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ runner.temp }}/ci_deploy_key
        run: bash ops/deploy-ci.sh
      - name: Remove the key from the runner
        if: always() && steps.key.outputs.configured == 'true'
        run: rm -f "$RUNNER_TEMP/ci_deploy_key"
