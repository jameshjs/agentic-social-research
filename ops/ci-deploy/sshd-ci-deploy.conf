# /etc/ssh/sshd_config.d/60-counterfactual-ci.conf — restrictions for the CI deploy account.
# The key list is root-owned, so ci-deploy cannot add keys or edit its own options.
Match User ci-deploy
	AuthorizedKeysFile /etc/ssh/counterfactual-ci/authorized_keys
	AuthenticationMethods publickey
	PasswordAuthentication no
	KbdInteractiveAuthentication no
	ForceCommand /usr/local/sbin/counterfactual-ci-receive
	PermitTTY no
	AllowTcpForwarding no
	AllowStreamLocalForwarding no
	AllowAgentForwarding no
	X11Forwarding no
	PermitTunnel no
	PermitUserRC no
	GatewayPorts no
